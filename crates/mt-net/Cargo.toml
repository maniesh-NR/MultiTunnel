[package]
name = "mt-net"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "MultiTunnel native data plane: SOCKS5/HTTP inbound, router, link aggregation"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "fs"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
bytes = "1"
futures = "0.3"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
# serde_json is only used by the router serde tests (library code never
# touches JSON directly; the service layer owns config files).
serde_json = "1"
