[package]
name = "mt-links"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "MultiTunnel share links, profile store and subscriptions"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
tracing = "0.1"
# Contract-allowed dep list (harness/CONTRACTS-S6.md "Deps allowed"): used
# for the percent decode/encode policy documented in lib.rs NOTE #3.
percent-encoding = "2"

[features]
default = ["fetch"]
fetch = ["dep:reqwest"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls"]
optional = true

[dev-dependencies]
# Test harness only: fetch_subscription is async (global rule 7), so its
# offline test needs a runtime. No test ever touches the network.
tokio = { version = "1", features = ["rt", "macros"] }
