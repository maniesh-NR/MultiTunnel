[package]
name = "mt-platform"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "MultiTunnel platform layer: app dirs, engine self-provisioning, autostart"

[dependencies]
mt-engine = { path = "../mt-engine" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing = "0.1"

[features]
default = ["net"]
net = ["dep:reqwest"]
embedded = []

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls"]
optional = true

[target."cfg(windows)".dependencies]
winreg = "0.56"
