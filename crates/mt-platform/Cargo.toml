[package]
name = "mt-platform"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "MultiTunnel platform layer: app dirs, engine self-provisioning, autostart"

[dependencies]
mt-engine = { path = "../mt-engine" }
# NOTE: the contract deps list omitted async-trait, but global rule 7
# mandates it for object-safe async traits; the frozen `EngineLocator`
# trait (mt-engine) is `#[async_trait]`, so the impl needs the same
# macro. Already in the workspace lock (mt-engine uses it).
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing = "0.1"

[features]
default = ["net"]
net = ["dep:reqwest"]
embedded = []

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls"]
optional = true

[target."cfg(windows)".dependencies]
winreg = "0.56"
# Adapter enumeration (GetAdaptersAddresses). Version pinned to the one
# already in the workspace lock (root crate) to avoid a second copy.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
# Tests of the async `ensure()`/`latest_release()` paths need a runtime.
tokio = { version = "1", features = ["rt", "macros"] }
