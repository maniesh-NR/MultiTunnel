name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # S3-REV-C P2-7: cache cargo artifacts between runs (default keying).
      - uses: Swatinem/rust-cache@v2
      # S4-REV-C P2-1: tag pushes bypass ci.yml, so a tag must not ship an
      # unlinted build either — fmt and clippy run before anything is built.
      # S6-REV-B P1-1: gates cover the WHOLE workspace (all 8 crates, 321
      # tests) — the root-only scope shipped the 7 new crates untested.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # S2-REV-B P1-1: a v* tag must never ship an untested build — tag
      # pushes bypass ci.yml, so the suite runs here before the build.
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = "${{ github.ref_name }}"
          $root = "dist/multitunnel-$v"
          New-Item -ItemType Directory -Force "$root/server" | Out-Null
          # Fail loudly on any missing input BEFORE copying anything.
          $required = @(
            "target/release/multitunnel.exe",
            "target/release/multitunnel-tray.exe",
            "config.example.json",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "server/setup-xray-reality.sh",
            "README.md",
            "QUICKSTART.md"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "missing required file: $f" }
          }
          Copy-Item "target/release/multitunnel.exe","target/release/multitunnel-tray.exe","config.example.json","LICENSE","THIRD_PARTY_NOTICES.md" $root
          Copy-Item "server/setup-xray-reality.sh" "$root/server/"
          # Hard-required above; plain copy (still listed in the zip manifest).
          Copy-Item "README.md","QUICKSTART.md" $root
          # Self-diagnosing listing: the run log shows exactly what is in
          # the package if anything downstream complains.
          Get-ChildItem -Recurse $root | Format-Table Name, Length
          # bsdtar (ships with windows runners) instead of Compress-Archive:
          # the latter intermittently fails on freshly built exes that
          # Defender is still scanning ("file in use"). -a selects the zip
          # format from the extension.
          tar -a -cf "$root-windows-x64.zip" -C dist "multitunnel-$v"
          if (-not (Test-Path "$root-windows-x64.zip")) { throw "zip was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.zip
          # S2-REV-B P2-7: a path typo must fail loudly, not ship a
          # release with zero assets.
          fail_on_unmatched_files: true
