name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # S2-REV-B P1-1: a v* tag must never ship an untested build — tag
      # pushes bypass ci.yml, so the suite runs here first.
      - run: cargo test
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force "dist/multitunnel-$v" | Out-Null
          New-Item -ItemType Directory -Force "dist/multitunnel-$v/server" | Out-Null
          Copy-Item server/setup-xray-reality.sh "dist/multitunnel-$v/server/"
          Copy-Item target/release/multitunnel.exe target/release/multitunnel-tray.exe config.example.json LICENSE THIRD_PARTY_NOTICES.md "dist/multitunnel-$v/"
          foreach ($f in @("README.md", "QUICKSTART.md")) {
            if (Test-Path $f) { Copy-Item $f "dist/multitunnel-$v/" }
          }
          Compress-Archive -Path "dist/multitunnel-$v" -DestinationPath "dist/multitunnel-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.zip
          # S2-REV-B P2-7: a path typo must fail loudly, not ship a
          # release with zero assets.
          fail_on_unmatched_files: true
