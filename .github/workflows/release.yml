name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force "dist/multitunnel-$v" | Out-Null
          Copy-Item target/release/multitunnel.exe target/release/multitunnel-tray.exe config.example.json README.md QUICKSTART.md LICENSE "dist/multitunnel-$v/"
          if (Test-Path THIRD_PARTY_NOTICES.md) { Copy-Item THIRD_PARTY_NOTICES.md "dist/multitunnel-$v/" }
          Compress-Archive -Path "dist/multitunnel-$v" -DestinationPath "dist/multitunnel-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.zip
