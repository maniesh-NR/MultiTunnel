name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # S3-REV-C P2-7: cache cargo artifacts (the action's default keying,
      # no custom paths).
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # S10: regression tests living inside the vendored iced patches.
      - run: cargo test -p iced_graphics -p iced_tiny_skia --lib
      # S6-REV-B P2-5: the GUI headless smoke run (view construction, theme
      # derivation, update loop) — wired as promised by CONTRACTS-S6; ubuntu
      # only (the leg is display-free by design).
      - name: gui headless smoke
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -q --bin multitunnel -- gui --smoke

  # S2-REV-B P2-2: the harness treats fmt/clippy cleanliness as gate
  # criteria; enforce them in CI instead of trusting local runs. The
  # windows-target clippy leg lives here (moved from cross-check after the
  # runner zigbuild flake — see LEDGER 2026-11-13T08:30Z, run 43391043999).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      # S6: ring (reqwest+rustls) needs a cross C compiler for the
      # windows-gnu clippy leg — zig cc via the repo's shim script.
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: windows-gnu clippy (zig cc shims)
        run: |
          sh scripts/mingw-zig-shims.sh /tmp/shims
          export CC_x86_64_pc_windows_gnu=/tmp/shims/zig-cc
          export CXX_x86_64_pc_windows_gnu=/tmp/shims/zig-cxx
          export AR_x86_64_pc_windows_gnu=/tmp/shims/zig-ar
          cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      # Pin zig to the exact version the sandbox gate is proven with (D2
      # recipe). The unpinned taiki-e ziglang pairing failed on the runner
      # while the same zigbuild is green locally; a `zig` binary on PATH
      # takes priority over the pip-ziglang fallback.
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - uses: taiki-e/install-action@cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - run: cargo zigbuild --workspace --target x86_64-pc-windows-gnu
