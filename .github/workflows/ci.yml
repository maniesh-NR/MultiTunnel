name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  # S2-REV-B P2-2: the harness treats fmt/clippy cleanliness as gate
  # criteria; enforce them in CI instead of trusting local runs. The
  # windows-target clippy leg needs no linker, so it lives here rather
  # than in cross-check (moved there after the runner zigbuild flake —
  # see LEDGER 2026-11-13T08:30Z; run 43391043999).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      # Pin zig to the exact version the sandbox gate is proven with (D2
      # recipe). The unpinned taiki-e ziglang pairing failed on the runner
      # while the same zigbuild is green locally; a `zig` binary on PATH
      # takes priority over the pip-ziglang fallback.
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - uses: taiki-e/install-action@cargo-zigbuild
      - run: cargo zigbuild --target x86_64-pc-windows-gnu
