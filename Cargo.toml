[package]
name = "multitunnel"
# Single source of truth for the release version (S17): crates that ship
# (this one + mt-app's titlebar display) inherit the workspace version, so a
# release bumps exactly one line.
version.workspace = true
edition = "2021"
license = "MIT"
description = "Windows supervisor that combines an Xray VLESS+REALITY tunnel with net-merge multi-link bonding"
repository = "https://github.com/maniesh-NR/MultiTunnel"
# True MSRV floor (S6-REV-B P1-2): material-colors 0.5.0 declares 1.97;
# uuid 1.89, tokio 1.85, iced 1.80 — cargo hard-fails below the max of these.
rust-version = "1.97"
publish = false

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.16.0"

[lib]
name = "multitunnel"
path = "src/lib.rs"

[[bin]]
name = "multitunnel"
path = "src/main.rs"

[[bin]]
name = "multitunnel-tray"
path = "src/bin/tray.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

# --- S6 wave 3: all-in-one wiring (GUI + data plane + engine + platform) ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"

mt-service = { path = "crates/mt-service" }
mt-bond = { path = "crates/mt-bond" }
mt-links = { path = "crates/mt-links" }
mt-net = { path = "crates/mt-net" }
mt-engine = { path = "crates/mt-engine" }
mt-platform = { path = "crates/mt-platform" }
# The GUI ships a MockService behind its default `mock` feature; the real
# binary must link the production service, so defaults are OFF here and the
# root `mock-gui` feature re-enables the mock for development/testing.
mt-app = { path = "crates/mt-app", default-features = false }

[features]
default = []
# Dev/CI: build the `gui` command against mt-app's MockService instead of the
# real backend (`cargo build --features mock-gui`).
mock-gui = ["mt-app/mock"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinInet"] }
winreg = "0.56.0"

# --- S10: vendored iced fixes (tiny, surgical; see vendor/*/README-MULTITUNNEL.md) ---
# 1. iced_graphics damage::group sorted with a NaN-unsafe comparator — any
#    INFINITE/NaN damage rectangle (center() = NaN) crashed the app with
#    "user-provided comparison function does not correctly implement a total
#    order" (v0.5.1 "Check exit IP" crash, reproduced in-sandbox).
# 2. iced_tiny_skia reported canvas damage/clips in LOCAL space against
#    ABSOLUTE bounds — every canvas not at the window origin produced zero
#    damage and was masked to the origin on partial redraws (the v0.5.1
#    "graphs don't load / out of frame" bug).
# Upstream 0.13.0 is the terminal release of the 0.13 line for these
# crates, so the fixes are carried as a path patch.
[patch.crates-io]
iced_graphics = { path = "vendor/iced_graphics" }
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
